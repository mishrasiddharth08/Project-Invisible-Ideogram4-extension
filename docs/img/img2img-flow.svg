<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="420" fill="#0f1117"/>
  <text x="480" y="42" text-anchor="middle" fill="#e8e8e8" font-size="24" font-weight="600">img2img: experimental latent regeneration</text>
  <text x="480" y="66" text-anchor="middle" fill="#9aa0a6" font-size="13">Editing stays in Forge's normal img2img tab — no separate workflow</text>

  <!-- flow -->
  <rect x="60" y="120" width="200" height="90" rx="10" fill="#161a22" stroke="#2c3240"/>
  <text x="160" y="152" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">Your image</text>
  <text x="160" y="176" text-anchor="middle" fill="#8b949e" font-size="12">upload in img2img tab</text>

  <text x="290" y="170" text-anchor="middle" fill="#6b7280" font-size="20">→</text>

  <rect x="330" y="120" width="200" height="90" rx="10" fill="#161a22" stroke="#2c3240"/>
  <text x="430" y="152" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">Denoising strength</text>
  <text x="430" y="176" text-anchor="middle" fill="#8b949e" font-size="12">lower = closer to source</text>
  <text x="430" y="194" text-anchor="middle" fill="#8b949e" font-size="12">0 = resize only · 1 = from noise</text>

  <text x="560" y="170" text-anchor="middle" fill="#6b7280" font-size="20">→</text>

  <rect x="600" y="120" width="200" height="90" rx="10" fill="#161a22" stroke="#2c3240"/>
  <text x="700" y="152" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">Ideogram 4 regen</text>
  <text x="700" y="176" text-anchor="middle" fill="#8b949e" font-size="12">experimental latent pipeline</text>

  <text x="830" y="170" text-anchor="middle" fill="#6b7280" font-size="20">→</text>

  <rect x="856" y="120" width="80" height="90" rx="10" fill="#d97706"/>
  <text x="896" y="170" text-anchor="middle" fill="#111" font-size="13" font-weight="700">Result</text>

  <!-- not supported -->
  <rect x="60" y="250" width="876" height="130" rx="12" fill="#1d1216" stroke="#7f1d1d"/>
  <text x="80" y="280" fill="#f87171" font-size="15" font-weight="600">Not supported</text>
  <text x="80" y="308" fill="#9aa0a6" font-size="13">• Inpainting / masks</text>
  <text x="80" y="332" fill="#9aa0a6" font-size="13">• Latent-only resizing</text>
  <text x="80" y="356" fill="#9aa0a6" font-size="13">• Native instruction-based editing ("make the sky red")</text>

  <text x="480" y="408" text-anchor="middle" fill="#6b7280" font-size="11">Tested in a standalone GPU check — treat as experimental</text>
</svg>
