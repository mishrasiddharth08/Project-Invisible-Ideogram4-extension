<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="640" fill="#0f1117"/>
  <text x="480" y="42" text-anchor="middle" fill="#e8e8e8" font-size="24" font-weight="600">Project Invisible · Ideogram 4 — panel layout</text>
  <text x="480" y="66" text-anchor="middle" fill="#9aa0a6" font-size="13">Everything lives inside Forge's normal txt2img / img2img view</text>

  <!-- Forge page frame -->
  <rect x="40" y="90" width="880" height="520" rx="12" fill="#161a22" stroke="#2c3240"/>
  <text x="60" y="118" fill="#9aa0a6" font-size="13">Forge — txt2img</text>
  <!-- prompt box -->
  <rect x="60" y="130" width="560" height="70" rx="8" fill="#1d2330" stroke="#333c4d"/>
  <text x="76" y="158" fill="#6b7280" font-size="13">Prompt</text>
  <text x="76" y="180" fill="#c9d1d9" font-size="12">a portrait of a fox researcher, soft light…</text>
  <!-- generate -->
  <rect x="640" y="130" width="120" height="70" rx="8" fill="#d97706"/>
  <text x="700" y="170" text-anchor="middle" fill="#111" font-size="14" font-weight="700">Generate</text>
  <!-- preset -->
  <rect x="780" y="130" width="120" height="70" rx="8" fill="#1d2330" stroke="#333c4d"/>
  <text x="795" y="158" fill="#6b7280" font-size="12">Preset</text>
  <text x="795" y="182" fill="#7dd3fc" font-size="13" font-weight="600">ideogram4 ▾</text>
  <text x="60" y="226" fill="#8b949e" font-size="12">① Pick the ideogram4 preset  ② pick your conditional checkpoint  ③ write a prompt  ④ Generate</text>

  <!-- collapsed accordion -->
  <rect x="60" y="250" width="840" height="52" rx="10" fill="#1a2030" stroke="#3b82f6"/>
  <text x="80" y="282" fill="#e8e8e8" font-size="15" font-weight="600">Ideogram 4 ▸ (collapsed by default)</text>
  <text x="520" y="282" fill="#8b949e" font-size="12">click to expand — ⑤</text>

  <!-- expanded panel -->
  <rect x="60" y="316" width="840" height="270" rx="10" fill="#141a26" stroke="#2c3240"/>
  <text x="80" y="344" fill="#e8e8e8" font-size="14" font-weight="600">Ideogram 4 ▾</text>

  <!-- recipe row -->
  <rect x="80" y="360" width="470" height="44" rx="8" fill="#1d2330" stroke="#333c4d"/>
  <text x="96" y="388" fill="#c9d1d9" font-size="13">Generation recipe:  <tspan fill="#fbbf24" font-weight="600">Balanced ▾</tspan></text>
  <rect x="560" y="360" width="320" height="44" rx="8" fill="#101726" stroke="#2c3240"/>
  <text x="576" y="379" fill="#8b949e" font-size="11">Official recipe note (TurboTime NOT used)</text>
  <text x="576" y="396" fill="#8b949e" font-size="11">⑥ choose a recipe · Forge owns size/seed/batch</text>

  <!-- tabs -->
  <g>
    <rect x="80"  y="420" width="180" height="36" rx="8" fill="#1d2330" stroke="#333c4d"/><text x="170" y="443" text-anchor="middle" fill="#e8e8e8" font-size="13">Style</text>
    <rect x="270" y="420" width="180" height="36" rx="8" fill="#1d2330" stroke="#333c4d"/><text x="360" y="443" text-anchor="middle" fill="#e8e8e8" font-size="13">Filter bypass</text>
    <rect x="460" y="420" width="180" height="36" rx="8" fill="#1d2330" stroke="#333c4d"/><text x="550" y="443" text-anchor="middle" fill="#e8e8e8" font-size="13">Performance</text>
    <rect x="650" y="420" width="180" height="36" rx="8" fill="#1d2330" stroke="#333c4d"/><text x="740" y="443" text-anchor="middle" fill="#e8e8e8" font-size="13">Model Setup</text>
  </g>

  <!-- status strip -->
  <rect x="80" y="470" width="800" height="40" rx="6" fill="#101726" stroke="#2c3240"/>
  <rect x="80" y="470" width="4" height="40" fill="#d97706"/>
  <text x="100" y="495" fill="#8b949e" font-size="12">Status strip — model found, adapter hints, memory state</text>

  <!-- progress bars -->
  <rect x="80" y="522" width="388" height="14" rx="7" fill="#0d1320" stroke="#2c3240"/>
  <rect x="80" y="522" width="180" height="14" rx="7" fill="#3b82f6"/>
  <rect x="492" y="522" width="388" height="14" rx="7" fill="#0d1320" stroke="#2c3240"/>
  <rect x="492" y="522" width="97" height="14" rx="7" fill="#22c55e"/>
  <text x="80" y="556" fill="#8b949e" font-size="12">current image</text>
  <text x="492" y="556" fill="#8b949e" font-size="12">overall batch  ⑦ live previews while sampling</text>

  <text x="480" y="632" text-anchor="middle" fill="#6b7280" font-size="11">PROJECT INVISIBLE — unofficial community extension</text>
</svg>
