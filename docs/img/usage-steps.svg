<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="620" fill="#0f1117"/>
  <text x="480" y="42" text-anchor="middle" fill="#e8e8e8" font-size="24" font-weight="600">Step-by-step: first generation</text>
  <text x="480" y="66" text-anchor="middle" fill="#9aa0a6" font-size="13">Text-to-image in Forge's normal workflow</text>

  <!-- Step 1 -->
  <rect x="60" y="100" width="840" height="96" rx="12" fill="#161a22" stroke="#2c3240"/>
  <circle cx="110" cy="148" r="22" fill="#3b82f6"/><text x="110" y="156" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
  <text x="150" y="132" fill="#e8e8e8" font-size="15" font-weight="600">Install</text>
  <text x="150" y="156" fill="#8b949e" font-size="13">Download ZIP → rename to project-invisible-ideogram-4 → put in extensions/</text>
  <text x="150" y="176" fill="#8b949e" font-size="13">Correct path ends with: extensions/project-invisible-ideogram-4/scripts/engine.py</text>

  <!-- Step 2 -->
  <rect x="60" y="212" width="840" height="96" rx="12" fill="#161a22" stroke="#2c3240"/>
  <circle cx="110" cy="260" r="22" fill="#8b5cf6"/><text x="110" y="268" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
  <text x="150" y="244" fill="#e8e8e8" font-size="15" font-weight="600">Model files</text>
  <text x="150" y="268" fill="#8b949e" font-size="13">Open the Model Setup tab → follow the printed source links → download weights manually</text>
  <text x="150" y="288" fill="#8b949e" font-size="13">conditional ckpt · text encoder · VAE (Generation never silently fetches weights)</text>

  <!-- Step 3 -->
  <rect x="60" y="324" width="840" height="96" rx="12" fill="#161a22" stroke="#2c3240"/>
  <circle cx="110" cy="372" r="22" fill="#22c55e"/><text x="110" y="380" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
  <text x="150" y="356" fill="#e8e8e8" font-size="15" font-weight="600">Select preset + checkpoint</text>
  <text x="150" y="380" fill="#8b949e" font-size="13">Preset selector → ideogram4 · checkpoint selector → your Ideogram 4 conditional model</text>
  <text x="150" y="400" fill="#8b949e" font-size="13">Start Forge normally; refresh browser with Ctrl+F5 after updates</text>

  <!-- Step 4 -->
  <rect x="60" y="436" width="840" height="96" rx="12" fill="#161a22" stroke="#2c3240"/>
  <circle cx="110" cy="484" r="22" fill="#f59e0b"/><text x="110" y="492" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
  <text x="150" y="468" fill="#e8e8e8" font-size="15" font-weight="600">Configure (optional)</text>
  <text x="150" y="492" fill="#8b949e" font-size="13">Expand the Ideogram 4 panel → keep Balanced recipe, batch 1, modest size for the first run</text>
  <text x="150" y="512" fill="#8b949e" font-size="13">Style adapters / Filter bypass / Performance are all optional — defaults just work</text>

  <!-- Step 5 -->
  <rect x="60" y="548" width="840" height="60" rx="12" fill="#161a22" stroke="#2c3240"/>
  <circle cx="110" cy="578" r="22" fill="#ef4444"/><text x="110" y="586" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">5</text>
  <text x="150" y="572" fill="#e8e8e8" font-size="15" font-weight="600">Generate</text>
  <text x="150" y="592" fill="#8b949e" font-size="13">Press Forge's normal Generate button → watch the two progress bars → image lands in your gallery</text>
</svg>
